<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoax Hunter | DigiSmart Lab</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #000; color: white; overflow: hidden; height: 100vh; }

        /* Layar Registrasi & Peringkat */
        .overlay-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; justify-content: center;
            align-items: center; z-index: 100; padding: 20px;
        }
        .card {
            background: rgba(15, 23, 42, 0.9); border: 2px solid #00f2ff;
            border-radius: 30px; padding: 30px; width: 100%; max-width: 450px;
            text-align: center; box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
        }
        input, select {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px;
            border: 1px solid #00f2ff; background: #000; color: white;
        }
        .btn-start {
            background: linear-gradient(to right, #00d2ff, #9d50bb);
            color: white; border: none; padding: 12px 40px; border-radius: 50px;
            font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 15px;
        }

        /* Area Game */
        #game-canvas { position: relative; width: 100%; height: 100vh; cursor: crosshair; display: none; }
        .bubble {
            position: absolute; width: 140px; padding: 15px; border-radius: 20px;
            font-size: 13px; font-weight: 600; text-align: center; cursor: pointer;
            animation: floatUp linear forwards; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .hoax { background: linear-gradient(135deg, #ef4444, #991b1b); border: 2px solid #fca5a5; }
        .fakta { background: linear-gradient(135deg, #22c55e, #166534); border: 2px solid #86efac; }

        @keyframes floatUp { from { bottom: -100px; } to { bottom: 110%; } }

        .game-header {
            position: absolute; top: 0; width: 100%; padding: 20px;
            display: flex; justify-content: space-between; background: rgba(0,0,0,0.5);
        }
        .leaderboard { margin-top: 20px; text-align: left; font-size: 14px; }
        .rank-item { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding: 5px 0; }
    </style>
</head>
<body>

    <div id="auth-screen" class="overlay-screen">
        <div class="card">
            <i class="fas fa-user-shield" style="font-size: 50px; color: #00f2ff; margin-bottom: 15px;"></i>
            <h2>Hoax Hunter Registration</h2>
            <input type="text" id="p-name" placeholder="Nama Lengkap">
            <select id="p-class">
                <option value="7">Kelas 7</option>
                <option value="8">Kelas 8</option>
                <option value="9">Kelas 9</option>
            </select>
            <button class="btn-start" onclick="initGame()">MASUK LEVEL 1</button>
            <div class="leaderboard">
                <p>🏆 TOP RANKING:</p>
                <div id="rank-display"></div>
            </div>
        </div>
    </div>

    <div id="game-canvas">
        <div class="game-header">
            <div>PLAYER: <span id="display-name" style="color:#00f2ff"></span></div>
            <div>SKOR: <span id="score" style="color:#facc15">0</span></div>
            <div>LEVEL: <span id="level" style="color:#00f2ff">1</span></div>
            <div>NYAWA: <span id="lives" style="color:#ef4444">❤❤❤</span></div>
        </div>
    </div>

    <script>
        let name, grade, score = 0, level = 1, lives = 3, gameActive = false, interval;
        const newsData = [
            { t: "Ketik 'P' agar baterai HP penuh otomatis!", type: "hoax" },
            { t: "Ibu kota Indonesia adalah Nusantara.", type: "fakta" },
            { t: "Hadiah 100jt dari link WhatsApp mencurigakan.", type: "hoax" },
            { t: "Membaca buku meningkatkan kecerdasan.", type: "fakta" },
            { t: "Makan cokelat bisa bikin kamu bisa terbang.", type: "hoax" }
        ];

        window.onload = showRank;

        function initGame() {
            name = document.getElementById('p-name').value;
            grade = document.getElementById('p-class').value;
            if(!name) return alert("Masukkan namamu!");
            
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('game-canvas').style.display = 'block';
            document.getElementById('display-name').innerText = `${name} (${grade})`;
            gameActive = true;
            runLevel();
        }

        function runLevel() {
            if(level > 10) return end("MISI SELESAI!", "Kamu Pelindung Informasi!");
            let speed = Math.max(1500, 4000 - (level * 300));
            interval = setInterval(() => { if(gameActive) createBubble(); }, speed);
        }

        function createBubble() {
            const b = document.createElement('div');
            const data = newsData[Math.floor(Math.random() * newsData.length)];
            b.className = `bubble ${data.type}`;
            b.innerText = data.text || data.t;
            b.style.left = Math.random() * (window.innerWidth - 150) + "px";
            
            let duration = Math.max(2, 6 - (level * 0.4));
            b.style.animationDuration = duration + "s";

            b.onclick = () => {
                if(data.type === 'hoax') {
                    score += 10;
                    if(score % 50 === 0) { level++; clearInterval(interval); runLevel(); }
                } else {
                    lives--;
                }
                updateUI();
                b.remove();
                if(lives <= 0) end("GAME OVER", "Hati-hati dengan berita palsu!");
            };

            b.onanimationend = () => {
                if(data.type === 'hoax' && b.parentElement) { lives--; updateUI(); }
                b.remove();
                if(lives <= 0) end("GAME OVER", "Terlalu banyak Hoax lolos!");
            };

            document.getElementById('game-canvas').appendChild(b);
        }

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('level').innerText = level;
            document.getElementById('lives').innerText = "❤".repeat(lives);
        }

        function end(title, msg) {
            gameActive = false;
            clearInterval(interval);
            saveRank(name, score);
            alert(`${title}\n${msg}\nSkor Akhir: ${score}`);
            location.reload();
        }

        function saveRank(n, s) {
            let ranks = JSON.parse(localStorage.getItem('hh_ranks')) || [];
            ranks.push({name: n, score: s});
            ranks.sort((a,b) => b.score - a.score);
            localStorage.setItem('hh_ranks', JSON.stringify(ranks.slice(0, 5)));
        }

        function showRank() {
            let ranks = JSON.parse(localStorage.getItem('hh_ranks')) || [];
            document.getElementById('rank-display').innerHTML = ranks.map((r, i) => 
                `<div class="rank-item"><span>${i+1}. ${r.name}</span><span>${r.score} PTS</span></div>`
            ).join('') || "Belum ada pejuang.";
        }
    </script>
</body>
</html>
