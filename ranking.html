<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papan Peringkat | DigiSmart Library</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold:#ffd700; --silver:#e2e8f0; --bronze:#cd7f32; --primary-blue:#3b82f6; --dark-blue:#0f172a; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        body {
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            min-height:100vh; display:flex; justify-content:center; align-items:center;
            padding:80px 20px 60px; color:white;
        }
        .btn-home {
            position:fixed; top:25px; left:25px;
            background:rgba(255,255,255,0.1); backdrop-filter:blur(10px);
            padding:12px 24px; border-radius:50px; text-decoration:none; color:white;
            font-weight:600; font-size:14px; border:1px solid rgba(255,255,255,0.2);
            transition:0.3s ease; z-index:1000; display:flex; align-items:center; gap:10px;
        }
        .btn-home:hover { background:white; color:var(--dark-blue); transform:translateX(-5px); }

        .ranking-container {
            background:rgba(255,255,255,0.05); backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,0.1); border-radius:35px;
            width:100%; max-width:600px; padding:50px 30px;
            text-align:center; box-shadow:0 40px 100px rgba(0,0,0,0.5);
            animation:fadeInPage 1s ease-out;
        }
        .header-box { margin-bottom:30px; }
        .ranking-title { font-family:'Montserrat'; font-size:2.2rem; font-weight:800; letter-spacing:-1px; margin-bottom:8px; }
        .ranking-subtitle { color:var(--primary-blue); font-weight:600; text-transform:uppercase; font-size:0.9rem; letter-spacing:2px; }

        /* Bar skor saya */
        .my-score-bar {
            background:linear-gradient(135deg,rgba(59,130,246,0.25),rgba(56,189,248,0.15));
            border:1px solid rgba(56,189,248,0.4); border-radius:16px;
            padding:14px 20px; margin-bottom:22px;
            display:flex; align-items:center; gap:14px;
        }
        .my-score-bar.hidden { display:none; }
        .my-pos  { font-family:'Montserrat'; font-size:22px; font-weight:800; color:#38bdf8; min-width:42px; }
        .my-info { flex:1; text-align:left; }
        .my-info-name { font-size:14px; font-weight:600; }
        .my-info-sub  { font-size:11px; color:#94a3b8; }
        .my-skor-num  { font-family:'Montserrat'; font-size:20px; font-weight:800; color:#38bdf8; }
        .my-skor-lbl  { font-size:10px; color:#64748b; text-align:right; }

        .info-note {
            font-size:12px; color:#64748b; margin-bottom:22px;
            border:1px solid rgba(255,255,255,0.06); border-radius:10px; padding:10px 16px;
        }

        .leaderboard { display:flex; flex-direction:column; gap:12px; margin-bottom:35px; }

        .rank-item {
            display:flex; align-items:center;
            background:rgba(255,255,255,0.03); padding:18px 25px;
            border-radius:20px; border:1px solid rgba(255,255,255,0.05);
            transition:0.4s cubic-bezier(0.23,1,0.32,1);
            opacity:0; transform:translateY(20px); animation:slideIn 0.6s forwards;
        }
        .rank-item:hover { background:rgba(255,255,255,0.1); transform:scale(1.02) translateY(-2px); border-color:rgba(255,255,255,0.2); }
        .rank-item.gold   { border-bottom:3px solid var(--gold);   background:rgba(255,215,0,0.05); }
        .rank-item.silver { border-bottom:3px solid var(--silver); }
        .rank-item.bronze { border-bottom:3px solid var(--bronze); }
        .rank-item.mine   { border:1px solid rgba(56,189,248,0.5); background:rgba(56,189,248,0.08); }

        .rank-number { width:45px; font-family:'Montserrat'; font-size:1.3rem; font-weight:800; color:rgba(255,255,255,0.4); }
        .gold   .rank-number { color:var(--gold); }
        .silver .rank-number { color:var(--silver); }
        .bronze .rank-number { color:var(--bronze); }

        .rank-info { flex-grow:1; text-align:left; padding-left:15px; }
        .player-name   { display:block; font-size:1rem; font-weight:600; color:white; }
        .player-points { font-size:0.82rem; color:#94a3b8; display:block; margin-top:2px; }
        .player-kelas  { font-size:0.75rem; color:#475569; display:block; }

        .rank-badge { font-size:1.5rem; filter:drop-shadow(0 0 8px rgba(255,255,255,0.15)); }

        /* Kosong */
        .empty-state { padding:40px 20px; color:#64748b; }
        .empty-state i { font-size:40px; display:block; margin-bottom:14px; }

        .btn-play {
            background:var(--primary-blue); color:white; border:none;
            padding:18px 45px; border-radius:100px; font-family:'Montserrat';
            font-weight:800; font-size:1rem; cursor:pointer;
            box-shadow:0 15px 30px rgba(59,130,246,0.3); transition:0.3s;
            text-transform:uppercase; letter-spacing:1px;
        }
        .btn-play:hover { transform:translateY(-5px); box-shadow:0 20px 40px rgba(59,130,246,0.5); background:#2563eb; }

        @keyframes fadeInPage { from{opacity:0;transform:scale(0.95)} to{opacity:1;transform:scale(1)} }
        @keyframes slideIn    { to{opacity:1;transform:translateY(0)} }

        .rank-item:nth-child(1){animation-delay:.15s}
        .rank-item:nth-child(2){animation-delay:.25s}
        .rank-item:nth-child(3){animation-delay:.35s}
        .rank-item:nth-child(4){animation-delay:.45s}
        .rank-item:nth-child(5){animation-delay:.55s}
        .rank-item:nth-child(n+6){animation-delay:.65s}

        @media(max-width:500px){
            .ranking-title{font-size:1.6rem}
            .btn-home{padding:10px 18px;font-size:12px}
            .ranking-container{padding:36px 18px}
        }
    </style>
</head>
<body>

<a href="index.html" class="btn-home"><i class="fas fa-arrow-left"></i> KEMBALI</a>

<section class="ranking-container">
    <div class="header-box">
        <h2 class="ranking-title">Papan Peringkat</h2>
        <p class="ranking-subtitle">DigiSmart · Literasi Game</p>
    </div>

    <!-- Posisi user yang sedang login -->
    <div class="my-score-bar hidden" id="myScoreBar">
        <div class="my-pos" id="myPos">#—</div>
        <div class="my-info">
            <div class="my-info-name" id="myName">—</div>
            <div class="my-info-sub">Posisi kamu saat ini</div>
        </div>
        <div>
            <div class="my-skor-num" id="mySkorNum">0</div>
            <div class="my-skor-lbl">poin</div>
        </div>
    </div>

    <div class="info-note">
        <i class="fas fa-info-circle" style="color:#3b82f6;margin-right:6px"></i>
        Ranking otomatis terupdate setiap kamu selesai bermain game.
    </div>

    <div class="leaderboard" id="leaderboard">
        <div class="empty-state">
            <i class="fas fa-trophy"></i>
            <p>Belum ada data ranking.<br>Jadilah yang pertama!</p>
        </div>
    </div>

    <button class="btn-play" onclick="location.href='game.html'">
        Main &amp; Kejar Skor! <i class="fas fa-rocket" style="margin-left:10px"></i>
    </button>
</section>

<script>
var session;
try { session = JSON.parse(localStorage.getItem('digi_session')); } catch(e) {}

var ranking = [];
try { ranking = JSON.parse(localStorage.getItem('digi_ranking') || '[]'); } catch(e) {}
ranking.sort(function(a,b){ return b.skor - a.skor; });

function getMedal(i){ return ['🥇','🥈','🥉'][i] || '⚡'; }
function getNum(i){ var n=i+1; return (n<10?'0':'')+n; }
function getRowClass(i){ return 'rank-item '+(['gold','silver','bronze'][i]||''); }
function getXPSub(i,skor){
    var label = ['· Sang Juara','· Pro Reader','· Book Worm'][i] || '';
    return skor+' XP '+label;
}

// Bar skor milik user yang login
if (session && session.loggedIn) {
    var myIdx = ranking.findIndex(function(r){
        return r.email && session.email && r.email.toLowerCase()===session.email.toLowerCase();
    });
    if (myIdx >= 0) {
        var me = ranking[myIdx];
        document.getElementById('myScoreBar').classList.remove('hidden');
        document.getElementById('myPos').textContent    = '#'+(myIdx+1);
        document.getElementById('myName').textContent   = me.nama;
        document.getElementById('mySkorNum').textContent= me.skor;
    }
}

// Render list
if (ranking.length > 0) {
    var html = '';
    ranking.forEach(function(r, i){
        var isMe = session && session.email && r.email &&
                   r.email.toLowerCase()===session.email.toLowerCase();
        html +=
            '<div class="'+getRowClass(i)+(isMe?' mine':'')+'">'+
                '<div class="rank-number">'+getNum(i)+'</div>'+
                '<div class="rank-info">'+
                    '<span class="player-name">'+
                        (r.nama||'-')+
                        (isMe ? ' <span style="font-size:11px;color:#38bdf8">(Kamu)</span>' : '')+
                    '</span>'+
                    '<span class="player-points">'+getXPSub(i,r.skor)+'</span>'+
                    '<span class="player-kelas">Kelas '+(r.kelas||'-')+'</span>'+
                '</div>'+
                '<div class="rank-badge">'+getMedal(i)+'</div>'+
            '</div>';
    });
    document.getElementById('leaderboard').innerHTML = html;
}
</script>
</body>
</html>
