<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin DigiSmart | Gressilliya</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        /* Tombol Kembali */
        .btn-back {
            position: fixed;
            top: 25px; left: 25px;
            padding: 10px 20px;
            background: white;
            border-radius: 50px;
            text-decoration: none;
            color: #007bff;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .btn-back:hover { background: #007bff; color: white; transform: scale(1.1); }

        /* Card Kreatif */
        .glass-profile {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 40px;
            padding: 40px;
            width: 90%; max-width: 800px;
            display: flex; align-items: center; gap: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            animation: fadeIn 0.8s ease-out;
        }
        /* Foto Animasi Blob */
        .img-box {
            width: 260px; height: 260px;
            background: #007bff;
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            animation: morph 6s ease-in-out infinite alternate;
            overflow: hidden;
            border: 6px solid white;
            flex-shrink: 0;
        }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }

        /* Tulisan */
        .info h2 { font-size: 2.2rem; color: #333; }
        .info h2 span { color: #007bff; }
        .bio { color: #666; margin: 15px 0 25px; line-height: 1.6; }
        
        .socials { display: flex; gap: 15px; }
        .btn-s {
            padding: 12px 25px; border-radius: 50px;
            text-decoration: none; font-weight: 700; transition: 0.3s;
        }
        .b-cv { background: #007bff; color: white; }
        .b-ig { background: #e1306c; color: white; }
        .btn-s:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }

        @keyframes morph {
            0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            100% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { .glass-profile { flex-direction: column; text-align: center; } }
    </style>
</head>
<body>
    <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Kembali</a>
