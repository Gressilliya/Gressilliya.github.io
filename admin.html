<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin DigiSmart | Gressilliya</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #fce7f3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Dekorasi Background (Lingkaran Melayang) */
        .circle {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            z-index: -1;
            animation: float-bg 10s infinite linear;
        }

        /* Tombol Kembali yang Lucu */
        .btn-back {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 25px;
            background: white;
            color: #0ea5e9;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: 0.3s;
            z-index: 100;
        }
        .btn-back:hover { background: #0ea5e9; color: white; transform: translateX(5px); }

        /* Kartu Admin Utama */
        .admin-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50px;
            padding: 50px;
            width: 90%;
            max-width: 850px;
            display: flex;
            align-items: center;
            gap: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            animation: popIn 0.8s ease-out;
        }

        /* Foto dengan Animasi Blob */
        .profile-area { position: relative; }
        
        .blob-photo {
            width: 260px;
            height: 260px;
            background: #0ea5e9;
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            animation: morph 6s ease-in-out infinite alternate;
            overflow: hidden;
            border: 8px solid white;
        }

        .blob-photo img { width: 100%; height: 100%; object-fit: cover; }

        .floating-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #f472b6;
            color: white;
            padding: 10px;
            border-radius: 50%;
            font-size: 20px;
            animation: bounce 2s infinite;
        }

        /* Teks & Bio */
        .text-area h2 { font-size: 2.2rem; color: #0c4a6e; font-weight: 800; }
        .text-area span { color: #0ea5e9; }
        .bio-text { color: #475569; margin: 15px 0 25px; line-height: 1.6; }

        /* Tombol Sosial Media */
        .social-links { display: flex; gap: 15px; }
        
        .btn-social {
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.4s;
        }

        .btn-cv { background: #0ea5e9; color: white; }
        .btn-ig { background: #f472b6; color: white; }

        .btn-social:hover { transform: scale(1.1) rotate(2deg); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

        /* Keyframes */
        @keyframes morph {
            0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            100% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        @keyframes float-bg {
            from { transform: translateY(0) rotate(0deg); }
            to { transform: translateY(-100vh) rotate(360deg); }
        }

        /* Responsif untuk HP */
        @media (max-width: 768px) {
            .admin-card { flex-direction: column; text-align: center; }
            .social-links { justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="circle" style="width:100px; height:100px; left:10%; bottom:-10%;"></div>
    <div class="circle" style="width:150px; height:150px; right:5%; top:10%; animation-delay: 2s;"></div>

    <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Home</a>

    <section class="admin-card">
        <div class="profile-area">
            <div class="blob-photo">
                <img src="profile.jpg" alt="Admin Gressilliya"> </div>
            <div class="floating-badge"><i class="fas fa-sparkles"></i></div>
        </div>

        <div class="text-area">
            <h2>Admin <span>DigiSmart</span> ✨</h2>
            <p class="bio-text">
                Halo, <strong>Sobat Digi!</strong> Saya <strong>Gressilliya Damanik</strong>, mahasiswa Perpustakaan & Sains Informasi. Saya percaya akses informasi adalah kunci masa depan. Mari jelajahi dunia digital yang seru bareng saya!
            </p>
            
            <div class="social-links">
                <a href="cv.jpg" class="btn-social btn-cv"><i class="fas fa-file-alt"></i> CV</a>
                <a href="https://instagram.com/gressilliya" class="btn-social btn-ig" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
            </div>
        </div>
    </section>

</body>
</html>
