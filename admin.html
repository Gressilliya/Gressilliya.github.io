<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin DigiSmart | Gressilliya</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Tombol Kembali Floating */
        .btn-back {
            position: fixed;
            top: 30px;
            left: 30px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            color: #333;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.3);
            transition: 0.3s;
        }
        .btn-back:hover { background: #007bff; color: white; transform: scale(1.1); }

        /* Kartu Profil Admin Glassmorphism */
        .admin-card {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px);
            border-radius: 50px;
            padding: 50px;
            width: 85%;
            max-width: 800px;
            display: flex;
            align-items: center;
            gap: 40px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 25px 45px rgba(0,0,0,0.1);
            animation: cardAppear 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Foto dengan Animasi Morphing */
        .img-container {
            width: 250px;
            height: 250px;
            background: #007bff;
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            animation: morph 8s ease-in-out infinite;
            overflow: hidden;
            border: 5px solid white;
            flex-shrink: 0;
        }

        .img-container img { width: 100%; height: 100%; object-fit: cover; }

        /* Area Teks */
        .info h2 { font-size: 2.2rem; color: #1a1a1a; margin-bottom: 5px; }
        .info h2 span { color: #007bff; }
        .tagline { font-weight: 600; color: #0056b3; display: block; margin-bottom: 15px; }
        .bio { color: #444; line-height: 1.6; margin-bottom: 25px; }

        /* Tombol Aksi */
        .btns { display: flex; gap: 15px; }
        .btns a {
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-cv { background: #007bff; color: white; }
        .btn-ig { background: white; color: #e1306c; border: 1px solid #e1306c; }
        .btns a:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

        /* Animasi */
        @keyframes morph {
            0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
            100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Responsif HP */
        @media (max-width: 768px) {
            .admin-card { flex-direction: column; text-align: center; }
            .btns { justify-content: center; }
        }

        /* MENGHAPUS TOTAL LINGKARAAN HIJAU PADA ADMIN */
.nav-item.admin, 
.nav-links li.admin {
    background: none !important;        /* Hapus warna latar hijau */
    background-color: transparent !important;
    border: none !important;            /* Hapus garis putus-putus hijau */
    outline: none !important;           /* Hapus garis luar */
    box-shadow: none !important;        /* Hapus efek glow */
    animation: none !important;         /* Hapus animasi berdenyut */
    padding: 0 !important;              /* Reset jarak agar sejajar */
    margin: 0 !important;
}

/* MENYAMAKAN TULISAN ADMIN DENGAN MENU LAIN */
.nav-item.admin a, 
.nav-links li.admin a {
    color: #444 !important;             /* Warna teks standar */
    background: none !important;
    border: none !important;
    padding: 10px 15px !important;      /* Sesuaikan padding menu utama kamu */
    font-weight: 600 !important;        /* Ketebalan font standar */
    text-decoration: none !important;
    display: inline-block !important;
}

/* EFEK HOVER SAAT DISENTUH (SAMA DENGAN BERANDA/PROFIL) */
.nav-item.admin a:hover, 
.nav-links li.admin a:hover {
    color: #007bff !important;          /* Warna biru saat hover */
    background: none !important;
}

    /* RESET TOTAL: Hapus semua gaya aneh pada menu Admin */
li.nav-item.admin, 
li.admin, 
.nav-item.admin {
    background: none !important;
    background-color: transparent !important;
    border: none !important;
    box-shadow: none !important;
    outline: none !important;
    animation: none !important;
    padding: 0 !important;
    margin: 0 !important;
}

/* Buat tulisan Admin jadi normal seperti Beranda/Profil */
li.nav-item.admin a, 
li.admin a, 
.nav-item.admin a {
    color: #444 !important; /* Warna teks standar menu kamu */
    background: none !important;
    border: none !important;
    font-weight: 600 !important;
    text-decoration: none !important;
    padding: 10px 15px !important;
    display: inline-block !important;
}

/* Efek Hover: Berubah biru saat disentuh (samakan dengan menu lain) */
li.nav-item.admin a:hover {
    color: #007bff !important; 
    background: none !important;
}
    </style>
</head>
<body>

    <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Kembali</a>

    <div class="admin-card">
        <div class="img-container">
            <img src="profile.jpg" alt="Gressilliya">
        </div>
        <div class="info">
            <h2>Admin <span>DigiSmart</span> ✨</h2>
            <span class="tagline">Gressilliya Damanik - Mhs. Perpustakaan</span>
            <p class="bio">
                Halo, <strong>Sobat Digi!</strong> Di sini aku siap jadi partner navigasimu menjelajahi rimba digital. Karena akses informasi adalah kunci masa depan! 🚀
            </p>
            <div class="btns">
                <a href="cv.jpg" class="btn-cv"><i class="fas fa-file-alt"></i> Lihat CV</a>
                <a href="https://instagram.com/gressilliya" class="btn-ig" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
            </div>
        </div>
    </div>

</body>
</html>
