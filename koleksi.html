<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koleksi Lengkap | DigiSmart Library</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f0f4f8; color: #1e293b; padding-bottom: 50px; }

        /* Header Modern */
        .header {
            background: linear-gradient(135deg, #007bff, #00d2ff);
            padding: 40px 20px; text-align: center; color: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); margin-bottom: 30px;
            border-bottom-left-radius: 30px; border-bottom-right-radius: 30px;
        }
        .btn-back {
            position: absolute; top: 20px; left: 20px;
            color: white; text-decoration: none; font-weight: 600;
        }

        /* Tab System */
        .tabs-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .tab-btn {
            padding: 12px 25px; border: none; background: white;
            color: #007bff; border-radius: 50px; font-weight: 700;
            cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .tab-btn.active { background: #007bff; color: white; transform: scale(1.1); }

        /* Grid Layout */
        .content-section { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: none; animation: slideUp 0.5s ease; }
        .content-section.active { display: block; }
        .section-title { margin: 30px 0 20px; font-size: 1.4rem; font-weight: 800; color: #334155; display: flex; align-items: center; gap: 10px; }

        .grid-mapel { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; }

        /* Card Styling */
        .card-mapel {
            background: white; padding: 25px; border-radius: 20px; text-align: center;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer;
            border: 1px solid #e2e8f0; box-shadow: 0 5px 15px rgba(0,0,0,0.02);
        }
        .card-mapel:hover { transform: translateY(-10px) rotate(2deg); border-color: #007bff; box-shadow: 0 15px 30px rgba(0,123,255,0.1); }
        .card-mapel i { font-size: 2.5rem; margin-bottom: 15px; display: block; }
        .card-mapel h4 { font-size: 0.95rem; font-weight: 700; }

        /* Warna Mapel */
        .c-mtk { color: #f59e0b; } .c-ipa { color: #10b981; } .c-ips { color: #3b82f6; }
        .c-ing { color: #ec4899; } .c-ind { color: #6366f1; } .c-pkn { color: #ef4444; }
        .c-tik { color: #06b6d4; } .c-rel { color: #8b5cf6; }

        /* Fokus UN Special */
        .un-grid { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
        .card-un { background: #fffbeb; border: 2px dashed #f59e0b; }
        .btn-kuis-un { 
            margin-top: 15px; width: 100%; padding: 10px; border-radius: 50px; 
            border: none; background: #f59e0b; color: white; font-weight: 700; cursor: pointer;
        }

        /* Modal Agama */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
        }
        .modal-content {
            background: white; margin: 10% auto; padding: 30px; border-radius: 25px;
            width: 90%; max-width: 500px; text-align: center; position: relative;
        }
        .close-btn { position: absolute; right: 20px; top: 15px; font-size: 1.5rem; cursor: pointer; }
        .agama-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn-agama { padding: 15px; border: 1px solid #e2e8f0; border-radius: 15px; background: #f8fafc; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn-agama:hover { background: #8b5cf6; color: white; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header class="header">
    <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Home</a>
    <h1>Pusat <span>Koleksi DigiSmart</span></h1>
    <p>Materi Lengkap & Latihan Soal untuk Kamu</p>
</header>

<div class="tabs-container">
    <button class="tab-btn active" onclick="showKelas('k7')">Kelas 7</button>
    <button class="tab-btn" onclick="showKelas('k8')">Kelas 8</button>
    <button class="tab-btn" onclick="showKelas('k9')">Kelas 9 & UN</button>
</div>

<div id="k7" class="content-section active">
    <h3 class="section-title">📚 Mata Pelajaran Utama</h3>
    <div class="grid-mapel" id="list-k7"></div>
</div>

<div id="k8" class="content-section">
    <h3 class="section-title">📚 Mata Pelajaran Utama</h3>
    <div class="grid-mapel" id="list-k8"></div>
</div>

<div id="k9" class="content-section">
    <h3 class="section-title">🚀 Persiapan Masuk SMA (Fokus UN)</h3>
    <div class="grid-mapel un-grid">
        <div class="card-mapel card-un"><i class="fas fa-calculator c-mtk"></i><h4>Fokus UN: MTK</h4><button class="btn-kuis-un">Mulai Kuis 📝</button></div>
        <div class="card-mapel card-un"><i class="fas fa-flask c-ipa"></i><h4>Fokus UN: IPA</h4><button class="btn-kuis-un">Mulai Kuis 📝</button></div>
        <div class="card-mapel card-un"><i class="fas fa-pen-nib c-ind"></i><h4>Fokus UN: B. Indonesia</h4><button class="btn-kuis-un">Mulai Kuis 📝</button></div>
        <div class="card-mapel card-un"><i class="fas fa-language c-ing"></i><h4>Fokus UN: B. Inggris</h4><button class="btn-kuis-un">Mulai Kuis 📝</button></div>
    </div>
    
    <h3 class="section-title">📚 Mata Pelajaran Reguler</h3>
    <div class="grid-mapel" id="list-k9"></div>
</div>

<div id="agamaModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeAgama()">&times;</span>
        <h3>Pilih Pendidikan Agama</h3>
        <div class="agama-list">
            <button class="btn-agama">Islam</button>
            <button class="btn-agama">Kristen Protestan</button>
            <button class="btn-agama">Katolik</button>
            <button class="btn-agama">Hindu</button>
            <button class="btn-agama">Buddha</button>
            <button class="btn-agama">Khonghucu</button>
        </div>
    </div>
</div>

<script>
    const mapels = [
        { name: 'Matematika', icon: 'fa-square-root-alt', color: 'c-mtk' },
        { name: 'IPA Terpadu', icon: 'fa-microscope', color: 'c-ipa' },
        { name: 'IPS Terpadu', icon: 'fa-atlas', color: 'c-ips' },
        { name: 'B. Inggris', icon: 'fa-comments', color: 'c-ing' },
        { name: 'B. Indonesia', icon: 'fa-pen-fancy', color: 'c-ind' },
        { name: 'Pendidikan Agama', icon: 'fa-pray', color: 'c-rel', isAgama: true },
        { name: 'PKN', icon: 'fa-balance-scale', color: 'c-pkn' },
        { name: 'Informatika (TIK)', icon: 'fa-laptop-code', color: 'c-tik' }
    ];

    function renderMapel(containerId) {
        const container = document.getElementById(containerId);
        mapels.forEach(m => {
            const card = document.createElement('div');
            card.className = 'card-mapel';
            if(m.isAgama) card.onclick = openAgama;
            card.innerHTML = `<i class="fas ${m.icon} ${m.color}"></i><h4>${m.name}</h4>`;
            container.appendChild(card);
        });
    }

    // Load semua list
    ['list-k7', 'list-k8', 'list-k9'].forEach(id => renderMapel(id));

    function showKelas(id) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function openAgama() { document.getElementById('agamaModal').style.display = 'block'; }
    function closeAgama() { document.getElementById('agamaModal').style.display = 'none'; }
    window.onclick = function(event) { if (event.target == document.getElementById('agamaModal')) closeAgama(); }
</script>

</body>
</html>
