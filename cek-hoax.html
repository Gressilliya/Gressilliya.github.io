<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoax Buster | DigiSmart Lab</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --scanner-green: #00ff41; 
            --alert-red: #ff3e3e; 
            --dark-scanner: #0a0a0a; 
            --neon-blue: #00d2ff;
        }

        body { 
            margin: 0; 
            font-family: 'Poppins', sans-serif; 
            background: var(--dark-scanner); 
            color: var(--scanner-green); 
            overflow: hidden; 
            height: 100vh; 
        }
        
        .scanner-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 255, 65, 0.1) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(0, 255, 65, 0.1) 1px, transparent 1px);
            background-size: 30px 30px; z-index: -1;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            from { background-position: 0 0; }
            to { background-position: 0 1000px; }
        }

        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 20px; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }

        .scanner-box {
            background: rgba(0, 255, 65, 0.05); 
            border: 2px solid var(--scanner-green); 
            border-radius: 30px;
            padding: 30px; 
            position: relative; 
            backdrop-filter: blur(15px); 
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.2);
            min-height: 500px; 
            text-align: center;
            transition: 0.5s;
        }

        /* Form Registrasi */
        .reg-input {
            width: 100%; padding: 15px; margin: 15px 0; 
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--scanner-green); 
            color: var(--scanner-green); 
            border-radius: 12px; 
            font-family: 'Orbitron';
            outline: none;
        }

        .reg-input:focus { box-shadow: 0 0 15px var(--scanner-green); }

        .scanner-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 5px; 
            background: var(--scanner-green);
            box-shadow: 0 0 20px var(--scanner-green); 
            animation: scan 4s ease-in-out infinite; 
            display: none;
            z-index: 10;
        }
        @keyframes scan { 0%, 100% { top: 5%; } 50% { top: 95%; } }

        #news-display {
            background: rgba(0,0,0,0.9); 
            border: 2px solid var(--neon-blue); 
            padding: 25px;
            border-radius: 20px; 
            margin: 25px 0; 
            min-height: 150px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 1.2rem;
            line-height: 1.6;
            animation: flicker 2s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .btn-choice {
            padding: 15px; font-family: 'Orbitron'; border-radius: 12px; 
            cursor: pointer; transition: 0.3s; border: 2px solid; width: 100%;
            font-weight: bold;
        }
        .btn-hoax { color: var(--alert-red); border-color: var(--alert-red); background: rgba(255, 62, 62, 0.1); }
        .btn-fakta { color: var(--scanner-green); border-color: var(--scanner-green); background: rgba(0, 255, 65, 0.1); }
        .btn-hoax:hover { background: var(--alert-red); color: black; box-shadow: 0 0 20px var(--alert-red); }
        .btn-fakta:hover { background: var(--scanner-green); color: black; box-shadow: 0 0 20px var(--scanner-green); }

        .btn-analyze { 
            background: var(--scanner-green); color: black; border: none; 
            padding: 18px 50px; border-radius: 50px; font-family: 'Orbitron'; 
            cursor: pointer; font-weight: bold; font-size: 1.1rem;
            transition: 0.4s;
        }
        .btn-analyze:hover { transform: scale(1.1); box-shadow: 0 0 30px var(--scanner-green); }

        .rank-box { margin-top: 30px; text-align: left; font-size: 0.9rem; border-top: 1px dashed var(--scanner-green); padding-top: 15px; }
        #game-ui, #result-ui { display: none; }
        .back-btn { position: fixed; top: 20px; left: 20px; color: var(--scanner-green); text-decoration: none; border: 1px solid var(--scanner-green); padding: 8px 20px; border-radius: 12px; font-family: 'Orbitron'; font-size: 0.8rem; z-index: 100; }
        
        /* Status Bar */
        .status-bar { display:flex; justify-content:space-between; font-family:'Orbitron'; font-size: 0.7rem; color: var(--neon-blue); margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="scanner-bg"></div>
    <a href="game.html" class="back-btn"><i class="fas fa-arrow-left"></i> KEMBALI</a>

    <div class="container">
        <div class="scanner-box" id="main-box">
            <div id="line" class="scanner-line"></div>

            <div id="start-ui">
                <h1 style="font-family: 'Orbitron'; letter-spacing: 3px; color: var(--neon-blue);">USER AUTHENTICATION</h1>
                <p style="font-size: 0.8rem; margin-bottom: 20px;">Silakan masukkan data untuk memulai scanning hoax.</p>
                
                <input type="text" id="p-name" class="reg-input" placeholder="NAMA LENGKAP AGENT">
                <select id="p-class" class="reg-input">
                    <option value="7">LEVEL: KELAS 7 (BASIC)</option>
                    <option value="8">LEVEL: KELAS 8 (INTERMEDIATE)</option>
                    <option value="9">LEVEL: KELAS 9 (ADVANCED)</option>
                </select>
                
                <button class="btn-analyze" onclick="initScanner()">INITIALIZE SYSTEM</button>
                
                <div class="rank-box">
                    <p><i class="fas fa-project-diagram"></i> LAST SCANNED AGENTS:</p>
                    <div id="leaderboard"></div>
                </div>
            </div>

            <div id="game-ui">
                <div class="status-bar">
                    <span><i class="fas fa-microchip"></i> AGENT: <span id="display-name">---</span></span>
                    <span><i class="fas fa-layer-group"></i> LEVEL: <span id="display-lv">0</span></span>
                    <span><i class="fas fa-database"></i> DATA: <span id="q-num">1</span>/10</span>
                </div>
                <div id="news-display">MENGAMBIL DATA...</div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <button class="btn-choice btn-hoax" onclick="analyze('hoax')">HOAX / PALSU</button>
                    <button class="btn-choice btn-fakta" onclick="analyze('fakta')">FAKTA / ASLI</button>
                </div>
                <div style="margin-top:25px; font-family:'Orbitron'; font-size: 0.8rem;">
                    SISTEM AKURASI: <span id="p-score" style="color: var(--neon-blue);">0</span>%
                </div>
            </div>

            <div id="result-ui">
                <h2 id="res-title" style="font-family: 'Orbitron';">SCANNING COMPLETE</h2>
                <div style="font-size: 5rem; font-family: 'Orbitron'; text-shadow: 0 0 20px var(--scanner-green);" id="final-scr">0</div>
                <p id="res-msg" style="padding: 0 20px;"></p>
                <button class="btn-analyze" style="margin-top:30px;" onclick="location.reload()">REBOOT SYSTEM</button>
            </div>
        </div>
    </div>

    <script>
        const allQuestions = {
            "7": [
                { t: "Makan cokelat bisa bikin kamu bisa terbang ke bulan malam ini.", type: "hoax" },
                { t: "Membagikan kata sandi WiFi ke orang asing bisa membahayakan datamu.", type: "fakta" },
                { t: "Menekan tombol 'Like' 100x akan mengubah warna HP-mu jadi emas.", type: "hoax" },
                { t: "Ibu kota Indonesia saat ini sedang dalam proses pindah ke Nusantara.", type: "fakta" },
                { t: "Minum air laut bisa menyembuhkan sakit gigi dalam satu detik.", type: "hoax" },
                { t: "Berita yang judulnya sangat heboh biasanya adalah klikbait atau hoax.", type: "fakta" },
                { t: "NASA menemukan naga api sedang tidur di dalam matahari.", type: "hoax" },
                { t: "Menggunakan helm saat naik motor adalah aturan keselamatan lalu lintas.", type: "fakta" },
                { t: "Kucing bisa bicara bahasa manusia jika diberi makan keju setiap jam.", type: "hoax" },
                { t: "Internet sehat adalah menggunakan internet untuk hal yang bermanfaat.", type: "fakta" }
            ],
            "8": [
                { t: "Sebuah aplikasi bernama 'X-Ray Camera' bisa melihat isi tas orang melalui kamera HP.", type: "hoax" },
                { t: "Kecerdasan Buatan (AI) dapat digunakan untuk memanipulasi video wajah orang (Deepfake).", type: "fakta" },
                { t: "Mengisi baterai HP hingga 100% setiap saat bisa memperpendek usia baterai lithium.", type: "fakta" },
                { t: "Pemerintah akan membagikan uang 10 juta bagi yang menyebarkan link ini ke 20 grup WA.", type: "hoax" },
                { t: "Tanda 'Gembok' pada alamat website (HTTPS) berarti koneksimu terenkripsi dan lebih aman.", type: "fakta" },
                { t: "Radiasi sinyal 5G dapat menyebabkan virus COVID-19 menyebar melalui udara.", type: "hoax" },
                { t: "Fitur 'Two-Factor Authentication' (2FA) menambah lapisan keamanan akun media sosial.", type: "fakta" },
                { t: "Menaruh bawang merah di pojok kamar dapat menyerap seluruh virus di udara.", type: "hoax" },
                { t: "Phishing adalah upaya mencuri data pribadi dengan menyamar sebagai institusi resmi.", type: "fakta" },
                { t: "Game online gratis selalu meminta data KTP untuk proses pendaftaran awal.", type: "hoax" }
            ],
            "9": [
                { t: "Enkripsi End-to-End berarti penyedia layanan tidak bisa membaca isi pesan pribadimu.", type: "fakta" },
                { t: "Botnet adalah jaringan komputer yang terinfeksi malware dan dikendalikan jarak jauh.", type: "fakta" },
                { t: "Algoritma media sosial dirancang untuk menampilkan konten yang hanya kamu sukai (Filter Bubble).", type: "fakta" },
                { t: "Software Open Source selalu mengandung virus karena kodenya bisa dilihat siapa saja.", type: "hoax" },
                { t: "Cookies pada browser digunakan untuk melacak preferensi browsing pengguna.", type: "fakta" },
                { t: "Hanya dengan membuka email tanpa klik link, seluruh isi rekening bank bisa langsung ludes.", type: "hoax" },
                { t: "Metadata pada sebuah foto digital dapat menyimpan lokasi GPS di mana foto itu diambil.", type: "fakta" },
                { t: "Incognito Mode pada browser membuat identitasmu sepenuhnya tidak terlihat oleh ISP/Provider.", type: "hoax" },
                { t: "Digital Footprint (Jejak Digital) sulit dihapus sepenuhnya meskipun postingan sudah di-delete.", type: "fakta" },
                { t: "Mematikan komputer secara paksa dengan cabut kabel setiap hari tidak akan merusak komponen.", type: "hoax" }
            ]
        };

        let currentQ = 0, score = 0, pName = "", pClass = "", activeQuestions = [];

        window.onload = showRank;

        function initScanner() {
            pName = document.getElementById('p-name').value.toUpperCase();
            pClass = document.getElementById('p-class').value;
            
            if(pName.length < 3) return alert("SISTEM: NAMA AGENT TERLALU PENDEK!");
            
            activeQuestions = allQuestions[pClass];
            
            document.getElementById('display-name').innerText = pName;
            document.getElementById('display-lv').innerText = pClass;
            document.getElementById('start-ui').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            document.getElementById('line').style.display = 'block';
            
            nextQuestion();
        }

        function nextQuestion() {
            if(currentQ < 10) {
                const box = document.getElementById('main-box');
                box.style.borderColor = "var(--neon-blue)";
                document.getElementById('q-num').innerText = currentQ + 1;
                document.getElementById('news-display').innerText = activeQuestions[currentQ].t;
            } else {
                finish();
            }
        }

        function analyze(choice) {
            if(choice === activeQuestions[currentQ].type) {
                score++;
                document.body.style.boxShadow = "inset 0 0 80px #00ff41";
            } else {
                document.body.style.boxShadow = "inset 0 0 80px #ff3e3e";
            }
            
            setTimeout(() => {
                document.body.style.boxShadow = "none";
                document.getElementById('p-score').innerText = Math.round((score/(currentQ+1))*100);
                currentQ++;
                nextQuestion();
            }, 400);
        }

        function finish() {
            document.getElementById('game-ui').style.display = 'none';
            document.getElementById('result-ui').style.display = 'block';
            document.getElementById('line').style.display = 'none';
            
            let finalScore = (score / 10) * 100;
            document.getElementById('final-scr').innerText = finalScore;
            
            let msg = "";
            if(finalScore === 100) msg = "SPECTACULAR! Kamu adalah Agent Literasi sejati. Tidak ada hoax yang bisa menembus pertahananmu!";
            else if(finalScore >= 70) msg = "GOOD JOB! Literasimu cukup kuat, namun tetap waspada dengan informasi yang terlalu bagus untuk jadi kenyataan.";
            else msg = "PERINGATAN! Kamu masih mudah terjebak hoax. Ayo perbanyak membaca dan cek fakta sebelum berbagi!";
            
            document.getElementById('res-msg').innerText = msg;
            saveRank(pName, finalScore, pClass);
        }

        function saveRank(n, s, c) {
            let ranks = JSON.parse(localStorage.getItem('hb_ranks')) || [];
            ranks.unshift({name: n, score: s, class: c});
            localStorage.setItem('hb_ranks', JSON.stringify(ranks.slice(0, 5)));
        }

        function showRank() {
            let ranks = JSON.parse(localStorage.getItem('hb_ranks')) || [];
            document.getElementById('leaderboard').innerHTML = ranks.map(r => 
                `<div style="margin-bottom:5px; color:#cbd5e1;"><i class="fas fa-user-secret"></i> ${r.name} (Lvl ${r.class}) - <span style="color:var(--scanner-green)">${r.score}%</span></div>`
            ).join('') || "NO DATA DETECTED.";
        }
    </script>
</body>
</html>
