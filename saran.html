<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: transparent; }
        #floating-saran {
            position: fixed; bottom: 20px; right: 20px;
            background: #38bdf8; color: white; width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        #chat-box {
            position: fixed; bottom: 90px; right: 20px;
            width: 300px; height: 400px; background: #1e293b;
            border-radius: 15px; display: none; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; border: 1px solid #334155;
        }
        .header { background: #38bdf8; color: white; padding: 15px; display: flex; justify-content: space-between; font-weight: bold; }
        .body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #0f172a; color: white; font-size: 13px; }
        .msg { padding: 8px 12px; border-radius: 10px; max-width: 80%; line-height: 1.4; }
        .bot { background: #334155; align-self: flex-start; }
        .user { background: #38bdf8; align-self: flex-end; }
        .btns { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
        .btns button { background: transparent; border: 1px solid #38bdf8; color: #38bdf8; padding: 4px 8px; border-radius: 10px; font-size: 11px; cursor: pointer; }
        .footer { padding: 10px; background: #1e293b; display: flex; gap: 5px; }
        .footer input { flex: 1; background: #0f172a; border: 1px solid #334155; padding: 8px; color: white; border-radius: 5px; outline: none; }
        .footer button { background: #38bdf8; border: none; color: white; padding: 8px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div id="floating-saran" onclick="toggleChat()"><i class="fas fa-comment"></i></div>

<div id="chat-box" style="display: none;">
    <div class="header"><span>🤖 DigiBot</span><i class="fas fa-times" onclick="toggleChat()" style="cursor:pointer"></i></div>
    <div class="body" id="chatBody">
        <div class="msg bot">Halo! Ada yang bisa saya bantu?</div>
        <div class="btns">
            <button onclick="jawab('Cara Mencari Buku')">Cari Buku</button>
            <button onclick="jawab('Jam Kunjungan')">Jam Kunjungan</button>
            <button onclick="jawab('Lupa Password')">Lupa Password</button>
        </div>
    </div>
    <div class="footer">
        <input type="text" id="userInput" placeholder="Tanya sesuatu..." onkeypress="if(event.key==='Enter') kirim()">
        <button onclick="kirim()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script>
    const data = {
        "mencari buku": "Gunakan menu 'Koleksi Digital' atau kotak pencarian di atas.",
        "jam kunjungan": "Senin-Kamis: 08:00-13:30. Jumat-Sabtu: 08:00-12:00.",
        "lupa password": "Hubungi admin di perpustakaan atau klik 'Lupa Password' di Login.",
        "admin": "Admin kami ada di meja informasi lantai 1.",
        "halo": "Halo! Ada yang bisa saya bantu?",
        "pagi": "Selamat pagi!"
    };

    function toggleChat() {
        const box = document.getElementById('chat-box');
        box.style.display = (box.style.display === 'none' || box.style.display === '') ? 'flex' : 'none';
    }

    function jawab(tanya) {
        addMsg(tanya, 'user');
        let respon = data[tanya.toLowerCase()] || "Maaf, saya kurang paham. Coba tanya 'admin' atau 'jam kunjungan'.";
        setTimeout(() => addMsg(respon, 'bot'), 500);
    }

    function kirim() {
        const inp = document.getElementById('userInput');
        if(!inp.value.trim()) return;
        addMsg(inp.value, 'user');
        
        let text = inp.value.toLowerCase();
        let respon = "Maaf, saya tidak mengerti kuncinya. Coba tanya 'admin'.";
        for(let key in data) {
            if(text.includes(key)) { respon = data[key]; break; }
        }
        
        setTimeout(() => addMsg(respon, 'bot'), 600);
        inp.value = "";
    }

    function addMsg(txt, kls) {
        const b = document.getElementById('chatBody');
        const d = document.createElement('div');
        d.className = 'msg ' + kls;
        d.innerText = txt;
        b.appendChild(d);
        b.scrollTop = b.scrollHeight;
    }
</script>
</body>
</html>
