<style>
    #floating-saran {
        position: fixed; bottom: 30px; right: 30px;
        background: linear-gradient(135deg, #38bdf8, #818cf8);
        color: white; width: 60px; height: 60px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 24px; cursor: pointer; z-index: 1000;
        box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4);
        transition: 0.3s;
    }

    #chat-container {
        position: fixed; bottom: 100px; right: 30px;
        width: 350px; max-height: 500px;
        background: #1e293b; border-radius: 20px;
        display: flex; flex-direction: column;
        box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        z-index: 1000; border: 1px solid rgba(255,255,255,0.1);
        overflow: hidden; transition: 0.3s ease-in-out;
    }

    .chat-hide { opacity: 0; pointer-events: none; transform: translateY(20px); }

    .chat-header {
        background: #38bdf8; padding: 15px;
        display: flex; justify-content: space-between; align-items: center;
        color: white; font-weight: bold;
    }

    .chat-body {
        padding: 15px; overflow-y: auto; flex-grow: 1;
        display: flex; flex-direction: column; gap: 10px;
        background: #0f172a; height: 350px;
    }

    .msg { padding: 10px 15px; border-radius: 15px; font-size: 13px; line-height: 1.4; max-width: 85%; }
    .msg.bot { background: #334155; color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
    .msg.user { background: #38bdf8; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }

    .quick-replies { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 5px; }
    .quick-replies button {
        background: rgba(56, 189, 248, 0.1); border: 1px solid #38bdf8;
        color: #38bdf8; padding: 5px 10px; border-radius: 20px;
        font-size: 11px; cursor: pointer; transition: 0.3s;
    }
    .quick-replies button:hover { background: #38bdf8; color: white; }

    .chat-footer { padding: 10px; background: #1e293b; display: flex; gap: 10px; }
    .chat-footer input {
        flex-grow: 1; background: #334155; border: none;
        padding: 10px; border-radius: 10px; color: white; outline: none;
    }
    .chat-footer button {
        background: #38bdf8; border: none; color: white;
        padding: 10px 15px; border-radius: 10px; cursor: pointer;
    }
</style>

<div id="floating-saran" onclick="toggleChat()">
    <i class="fas fa-comment-alt"></i>
</div>

<div id="chat-container" class="chat-hide">
    <div class="chat-header">
        <span>🤖 DigiSmart Bot</span>
        <i class="fas fa-times" style="cursor:pointer" onclick="toggleChat()"></i>
    </div>
    <div class="chat-body" id="chatBody">
        <div class="msg bot">Halo! Saya asisten DigiSmart. Klik pertanyaan di bawah atau ketik sesuatu untuk bertanya. 😊</div>
        <div class="quick-replies" id="quickReplies">
            <button onclick="askBot('Cara Mencari Buku')">Cara Mencari Buku</button>
            <button onclick="askBot('Jam Kunjungan')">Jam Kunjungan</button>
            <button onclick="askBot('Lupa Password')">Lupa Password</button>
        </div>
    </div>
    <div class="chat-footer">
        <input type="text" id="userInput" placeholder="Tanya admin..." onkeypress="handleKey(event)">
        <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>
