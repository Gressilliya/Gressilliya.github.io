<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* PENTING: Membuat latar belakang file ini tembus pandang */
        html, body { 
            margin: 0; 
            padding: 0; 
            background: transparent !important; 
            overflow: hidden; 
            font-family: 'Poppins', sans-serif;
        }

        /* Tombol Bulat Biru */
        #floating-saran {
            position: fixed; 
            bottom: 20px; 
            right: 20px;
            background: #007bff; 
            color: white; 
            width: 60px; 
            height: 60px; 
            border-radius: 50%;
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 24px; 
            cursor: pointer; 
            z-index: 1000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        /* Kotak Chat */
        #chat-box {
            position: fixed; 
            bottom: 90px; 
            right: 20px;
            width: 300px; 
            height: 400px; 
            background: #1e293b;
            border-radius: 15px; 
            display: none; /* Sembunyi di awal */
            flex-direction: column;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            overflow: hidden; 
            border: 1px solid rgba(255,255,255,0.1);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header { 
            background: #007bff; 
            color: white; 
            padding: 15px; 
            display: flex; 
            justify-content: space-between; 
            font-weight: bold; 
        }

        .body { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            background: #0f172a; 
            color: white; 
            font-size: 13px; 
        }

        /* Balon Chat */
        .msg { padding: 8px 12px; border-radius: 12px; max-width: 85%; line-height: 1.4; }
        .bot { background: #334155; align-self: flex-start; color: #fff; }
        .user { background: #007bff; align-self: flex-end; color: #fff; }

        /* Tombol Pertanyaan Cepat */
        .btns { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
        .btns button { 
            background: rgba(0, 123, 255, 0.1); 
            border: 1px solid #007bff; 
            color: #007bff; 
            padding: 5px 10px; 
            border-radius: 15px; 
            font-size: 11px; 
            cursor: pointer;
            transition: 0.2s;
        }
        .btns button:hover { background: #007bff; color: white; }

        .footer { padding: 10px; background: #1e293b; display: flex; gap: 8px; }
        .footer input { 
            flex: 1; 
            background: #0f172a; 
            border: 1px solid #334155; 
            padding: 8px; 
            color: white; 
            border-radius: 8px; 
            outline: none; 
        }
        .footer button { 
            background: #007bff; 
            border: none; 
            color: white; 
            padding: 8px 12px; 
            border-radius: 8px; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

<div id="floating-saran" onclick="toggleChat()">
    <i class="fas fa-comment-dots"></i>
</div>

<div id="chat-box">
    <div class="header">
        <span>🤖 DigiSmart Bot</span>
        <i class="fas fa-times" onclick="toggleChat()" style="cursor:pointer"></i>
    </div>
    <div class="body" id="chatBody">
        <div class="msg bot">Halo! Saya asisten DigiSmart. Ada yang bisa dibantu? 😊</div>
        <div class="btns">
            <button onclick="askBot('Cara Mencari Buku')">Cara Mencari Buku</button>
            <button onclick="askBot('Jam Kunjungan')">Jam Kunjungan</button>
            <button onclick="askBot('Lupa Password')">Lupa Password</button>
        </div>
    </div>
    <div class="footer">
        <input type="text" id="userInput" placeholder="Ketik pesan..." onkeypress="handleKey(event)">
        <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script>
    // Database Jawaban
    const responses = {
        "mencari buku": "Gunakan fitur 'Pusat Literasi' atau ketik judul di pencarian katalog atas.",
        "jam kunjungan": "Senin-Kamis: 08:00-13:30, Jumat-Sabtu: 08:00-12:00.",
        "lupa password": "Klik 'Lupa Password' di menu login atau lapor ke petugas perpustakaan.",
        "admin": "Admin Perpustakaan adalah Tim Pustakawan yang bertugas di meja sirkulasi.",
        "meminjam": "Pilih buku, lalu klik tombol 'Baca' atau 'Pinjam' jika sudah login.",
        "halo": "Halo! Senang bertemu kamu di DigiSmart Library.",
        "pagi": "Selamat pagi! Semangat literasi ya!"
    };

    function toggleChat() {
        const box = document.getElementById('chat-box');
        box.style.display = (box.style.display === 'none' || box.style.display === '') ? 'flex' : 'none';
    }

    function askBot(q) {
        addMsg(q, 'user');
        const reply = responses[q.toLowerCase()] || "Maaf, saya belum mengerti. Coba tanya tentang 'admin' atau 'jam kunjungan'.";
        setTimeout(() => addMsg(reply, 'bot'), 500);
    }

    function sendMessage() {
        const inp = document.getElementById('userInput');
        const txt = inp.value.trim();
        if (!txt) return;

        addMsg(txt, 'user');
        inp.value = "";

        setTimeout(() => {
            let reply = "Maaf, saya tidak mengerti. Coba gunakan kata kunci seperti 'admin' atau 'buku'.";
            for (let key in responses) {
                if (txt.toLowerCase().includes(key)) {
                    reply = responses[key];
                    break;
                }
            }
            addMsg(reply, 'bot');
        }, 700);
    }

    function handleKey(e) { if (e.key === 'Enter') sendMessage(); }

    function addMsg(text, sender) {
        const b = document.getElementById('chatBody');
        const d = document.createElement('div');
        d.className = 'msg ' + sender;
        d.innerText = text;
        b.appendChild(d);
        b.scrollTop = b.scrollHeight;
    }
</script>

</body>
</html>
