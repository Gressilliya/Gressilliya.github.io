<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Anggota - DigiSmart Library</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)),
                        url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover; background-position: center;
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .login-card {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(20px);
            padding: 40px; border-radius: 25px; width: 100%; max-width: 420px;
            border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: fadeInDown 0.8s ease; position: relative; margin: 20px;
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .logo-area { text-align: center; margin-bottom: 24px; }
        .logo-area img { width: 54px; height: 54px; border-radius: 50%; border: 2px solid #38bdf8; margin-bottom: 10px; }
        .login-card h2 { color: #fff; text-align: center; margin-bottom: 6px; font-size: 26px; font-weight: 600; }
        .login-card p  { color: rgba(255,255,255,0.6); text-align: center; margin-bottom: 28px; font-size: 13px; }

        .input-group { position: relative; margin-bottom: 16px; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #38bdf8; font-size: 1rem; }
        .input-group input {
            width: 100%; padding: 13px 15px 13px 45px;
            background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px; color: #fff; outline: none; font-size: 0.95rem; transition: 0.3s;
        }
        .input-group input::placeholder { color: rgba(255,255,255,0.45); }
        .input-group input:focus { background: rgba(255,255,255,0.15); border-color: #38bdf8; box-shadow: 0 0 12px rgba(56,189,248,0.3); }

        /* Pesan error/sukses */
        .alert {
            display: none; padding: 10px 14px; border-radius: 10px;
            font-size: 13px; margin-bottom: 14px; text-align: center;
        }
        .alert.error   { background: rgba(239,68,68,0.25); border: 1px solid rgba(239,68,68,0.5); color: #fca5a5; display: block; }
        .alert.success { background: rgba(34,197,94,0.2);  border: 1px solid rgba(34,197,94,0.4);  color: #86efac; display: block; }

        .btn-login {
            width: 100%; padding: 14px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            border: none; border-radius: 12px; color: white; font-weight: 600;
            cursor: pointer; transition: 0.4s; letter-spacing: 1px; margin-top: 6px;
            display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 15px;
        }
        .btn-login:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(56,189,248,0.4); }
        .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        .loader {
            width: 18px; height: 18px; border: 3px solid #fff;
            border-bottom-color: transparent; border-radius: 50%;
            display: none; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer-link { text-align: center; margin-top: 22px; color: rgba(255,255,255,0.55); font-size: 13px; }
        .footer-link a { color: #38bdf8; text-decoration: none; font-weight: 600; }
        .footer-link a:hover { text-decoration: underline; }

        .btn-back {
            position: absolute; top: 20px; left: 20px; color: white; text-decoration: none;
            display: flex; align-items: center; gap: 6px; font-size: 13px;
            background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 50px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); transition: 0.3s;
        }
        .btn-back:hover { background: #38bdf8; }
    </style>
</head>
<body>

<a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Beranda</a>

<div class="login-card">
    <div class="logo-area">
        <img src="logo.jpg" alt="Logo DigiSmart" onerror="this.style.display='none'">
    </div>
    <h2>Login Anggota</h2>
    <p>Masukkan data yang kamu daftarkan</p>

    <div class="alert" id="alertBox"></div>

    <form id="loginForm" novalidate>
        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email" id="loginEmail" placeholder="Alamat Email" required autocomplete="email">
        </div>
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="loginPhone" placeholder="No. WhatsApp (sebagai kata sandi)" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login" id="btnLogin">
            <span id="btnText">Masuk Perpustakaan</span>
            <div class="loader" id="loader"></div>
        </button>
    </form>

    <div class="footer-link">Belum punya akun? <a href="daftar.html">Daftar Sekarang</a></div>
</div>

<script>
function getUsers() {
    return JSON.parse(localStorage.getItem('digi_users') || '[]');
}

function showAlert(message, type) {
    const alertBox = document.getElementById('alertBox');
    alertBox.textContent = message;
    alertBox.className = 'alert ' + type;
}

// Jika sudah login
const currentSession = JSON.parse(localStorage.getItem('digi_session') || 'null');

if (currentSession && currentSession.loggedIn) {
    window.location.href = 'index.html';
}

document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const phone = document.getElementById('loginPhone').value.trim();

    if (!email || !phone) {
        showAlert('Semua kolom wajib diisi.', 'error');
        return;
    }

    const btn = document.getElementById('btnLogin');
    const loader = document.getElementById('loader');
    const btnText = document.getElementById('btnText');

    btn.disabled = true;
    loader.style.display = 'inline-block';
    btnText.textContent = 'Memeriksa...';

    setTimeout(() => {

        const users = getUsers();

        const user = users.find(u =>
            u.email &&
            u.phone &&
            u.email.toLowerCase().trim() === email &&
            u.phone.trim() === phone
        );

        if (!user) {
            showAlert(
                'Email atau nomor WhatsApp tidak sesuai dengan data pendaftaran.',
                'error'
            );

            btn.disabled = false;
            loader.style.display = 'none';
            btnText.textContent = 'Masuk Perpustakaan';
            return;
        }

        // Simpan session login
        localStorage.setItem('digi_session', JSON.stringify({
            loggedIn: true,
            nama: user.nama,
            email: user.email,
            kelas: user.kelas,
            loginTime: new Date().toISOString()
        }));

        showAlert('Login berhasil! Mengalihkan...', 'success');

        setTimeout(() => {
            window.location.href = 'index.html';
        }, 1000);

    }, 800);
});
</script>

</body>
</html>
