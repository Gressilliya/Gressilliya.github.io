<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Anggota – DigiSmart Library</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:        #0a141a;
            --surface:   #0f1c24;
            --surface2:  #1a2d3a;
            --accent:    #2dd4bf;
            --accent-dim: rgba(45,212,191,0.12);
            --accent-glow: rgba(45,212,191,0.28);
            --border:    rgba(45,212,191,0.18);
            --text:      #e2e8f0;
            --muted:     #7c9db0;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ── ANIMATED BACKGROUND ── */
        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .bg-canvas::before {
            content: '';
            position: absolute;
            width: 600px; height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(45,212,191,0.07) 0%, transparent 70%);
            top: -150px; left: -150px;
            animation: pulse 8s ease-in-out infinite;
        }
        .bg-canvas::after {
            content: '';
            position: absolute;
            width: 500px; height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(45,212,191,0.05) 0%, transparent 70%);
            bottom: -100px; right: -100px;
            animation: pulse 10s ease-in-out infinite reverse;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50%       { transform: scale(1.15); opacity: 0.6; }
        }

        /* grid lines */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(45,212,191,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(45,212,191,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
        }

        /* ── BACK BUTTON ── */
        .btn-back {
            position: fixed;
            top: 24px; left: 24px;
            z-index: 100;
            display: flex; align-items: center; gap: 8px;
            color: var(--muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 9px 16px;
            border-radius: 50px;
            transition: all 0.3s;
        }
        .btn-back:hover {
            color: var(--accent);
            border-color: var(--accent);
            background: var(--accent-dim);
        }

        /* ── CARD ── */
        .card {
            position: relative;
            z-index: 10;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 44px 40px 36px;
            width: 100%;
            max-width: 420px;
            margin: 20px;
            box-shadow: 0 0 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(45,212,191,0.06);
            animation: slideUp 0.55s cubic-bezier(0.175,0.885,0.32,1.275) both;
        }
        @keyframes slideUp {
            from { opacity:0; transform: translateY(30px); }
            to   { opacity:1; transform: translateY(0); }
        }

        /* top accent line */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 24px; right: 24px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            border-radius: 2px;
        }

        /* ── HEADER ── */
        .card-header { text-align: center; margin-bottom: 32px; }
        .logo-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px; height: 64px;
            border-radius: 50%;
            background: var(--accent-dim);
            border: 2px solid var(--accent);
            margin-bottom: 16px;
            position: relative;
        }
        .logo-wrap img {
            width: 46px; height: 46px;
            border-radius: 50%;
            object-fit: cover;
        }
        .logo-wrap .fallback-icon {
            font-size: 24px;
            color: var(--accent);
        }
        .logo-wrap::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1px dashed rgba(45,212,191,0.3);
            animation: spin 12s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: var(--accent);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .card-title {
            color: var(--text);
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .card-sub {
            color: var(--muted);
            font-size: 13px;
        }

        /* ── FORM ── */
        .field { margin-bottom: 14px; }
        .field label {
            display: block;
            color: var(--muted);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 7px;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap i {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            color: var(--accent);
            font-size: 14px;
            pointer-events: none;
        }
        .input-wrap input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: var(--surface2);
            border: 1px solid rgba(45,212,191,0.15);
            border-radius: 12px;
            color: var(--text);
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
        }
        .input-wrap input::placeholder { color: rgba(124,157,176,0.6); }
        .input-wrap input:focus {
            border-color: var(--accent);
            background: rgba(45,212,191,0.06);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* toggle password */
        .toggle-pw {
            position: absolute;
            right: 14px; top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            cursor: pointer;
            font-size: 14px;
            transition: color 0.2s;
        }
        .toggle-pw:hover { color: var(--accent); }

        /* ── ALERT ── */
        .alert {
            display: none;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 14px;
            text-align: center;
            line-height: 1.4;
        }
        .alert.show-error {
            display: block;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5;
        }
        .alert.show-success {
            display: block;
            background: rgba(45,212,191,0.1);
            border: 1px solid rgba(45,212,191,0.3);
            color: var(--accent);
        }

        /* ── BUTTON ── */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0d9488, var(--accent));
            border: none;
            border-radius: 12px;
            color: #0a141a;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.3s, box-shadow 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
            letter-spacing: 0.03em;
        }
        .btn-login:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(45,212,191,0.35);
        }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* spinner */
        .spinner {
            display: none;
            width: 16px; height: 16px;
            border: 2.5px solid #0a141a;
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotate 0.8s linear infinite;
        }
        @keyframes rotate { to { transform: rotate(360deg); } }

        /* ── DIVIDER ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0;
            color: var(--muted);
            font-size: 11px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── FOOTER ── */
        .card-footer {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }
        .card-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .card-footer a:hover { opacity: 0.8; text-decoration: underline; }
    </style>
</head>
<body>

<div class="grid-bg"></div>
<div class="bg-canvas"></div>

<a href="index.html" class="btn-back">
    <i class="fas fa-arrow-left"></i> Beranda
</a>

<div class="card">

    <div class="card-header">
        <div class="logo-wrap">
            <img src="logo.jpg" alt="Logo DigiSmart"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
            <i class="fas fa-book-open fallback-icon" style="display:none"></i>
        </div>
        <div class="brand">DigiSmart Library</div>
        <div class="card-title">Masuk ke Akunmu</div>
        <div class="card-sub">Gunakan email &amp; nomor WhatsApp yang didaftarkan</div>
    </div>

    <div class="alert" id="alertBox"></div>

    <div id="loginSection">
        <div class="field">
            <label for="loginEmail">Alamat Email</label>
            <div class="input-wrap">
                <i class="fas fa-envelope"></i>
                <input type="email" id="loginEmail" placeholder="contoh@email.com"
                       autocomplete="email" required>
            </div>
        </div>

        <div class="field">
            <label for="loginPhone">Kata Sandi (No. WhatsApp)</label>
            <div class="input-wrap">
                <i class="fas fa-lock"></i>
                <input type="password" id="loginPhone" placeholder="Nomor WhatsApp kamu"
                       autocomplete="current-password" required>
                <i class="fas fa-eye toggle-pw" id="togglePw" title="Tampilkan / sembunyikan"></i>
            </div>
        </div>

        <button class="btn-login" id="btnLogin" onclick="doLogin()">
            <span id="btnText">Masuk Perpustakaan</span>
            <div class="spinner" id="spinner"></div>
        </button>
    </div>

    <div class="divider">atau</div>

    <div class="card-footer">
        Belum punya akun? <a href="daftar.html">Daftar Sekarang</a>
    </div>

</div>

<script>
/* ── Helpers ── */
function getUsers() {
    try { return JSON.parse(localStorage.getItem('digi_users') || '[]'); } catch { return []; }
}
function setSession(user) {
    localStorage.setItem('digi_session', JSON.stringify({
        nama: user.nama, email: user.email, kelas: user.kelas, loggedIn: true
    }));
}
function showAlert(msg, type) {
    const el = document.getElementById('alertBox');
    el.textContent = msg;
    el.className = 'alert ' + (type === 'error' ? 'show-error' : 'show-success');
}
function hideAlert() {
    const el = document.getElementById('alertBox');
    el.className = 'alert';
}

/* ── Redirect jika sudah login ── */
(function() {
    try {
        const s = JSON.parse(localStorage.getItem('digi_session'));
        if (s && s.loggedIn) window.location.href = 'index.html';
    } catch {}
})();

/* ── Toggle password visibility ── */
document.getElementById('togglePw').addEventListener('click', function () {
    const input = document.getElementById('loginPhone');
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    this.className = 'fas toggle-pw ' + (isHidden ? 'fa-eye-slash' : 'fa-eye');
});

/* ── Enter key submit ── */
['loginEmail', 'loginPhone'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doLogin();
    });
});

/* ── Proses Login ── */
function doLogin() {
    hideAlert();

    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const phone = document.getElementById('loginPhone').value.trim();

    if (!email || !phone) {
        showAlert('Isi semua kolom terlebih dahulu.', 'error');
        return;
    }
    if (!/\S+@\S+\.\S+/.test(email)) {
        showAlert('Format email tidak valid.', 'error');
        return;
    }

    const btn     = document.getElementById('btnLogin');
    const spinner = document.getElementById('spinner');
    const btnTxt  = document.getElementById('btnText');

    btnTxt.textContent = 'Memeriksa…';
    spinner.style.display = 'block';
    btn.disabled = true;

    setTimeout(() => {
        const users = getUsers();
        const found = users.find(u =>
            u.email.toLowerCase() === email && u.phone === phone
        );

        if (!found) {
            showAlert('Email atau nomor HP tidak ditemukan. Pastikan sudah daftar terlebih dahulu.', 'error');
            btnTxt.textContent = 'Masuk Perpustakaan';
            spinner.style.display = 'none';
            btn.disabled = false;
            return;
        }

        setSession(found);
        showAlert('Login berhasil! Mengalihkan ke beranda…', 'success');
        setTimeout(() => { window.location.href = 'index.html'; }, 1200);

    }, 900);
}
</script>
</body>
</html>
