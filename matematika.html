<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Logic | DigiSmart Lab</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-purple: #9d50bb;
            --dark-bg: #020617;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: var(--dark-bg); 
            color: white; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Background Animasi */
        .math-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(2, 6, 23, 0.8), rgba(2, 6, 23, 0.8)),
                        url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            z-index: -1;
        }

        /* Navigasi */
        .nav-top {
            position: fixed; top: 0; width: 100%; padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 23, 42, 0.9); border-bottom: 2px solid var(--neon-blue);
            z-index: 100;
        }
        .btn-home {
            color: var(--neon-blue); text-decoration: none; font-weight: bold;
            display: flex; align-items: center; gap: 10px; transition: 0.3s;
        }
        .btn-home:hover { text-shadow: 0 0 10px var(--neon-blue); transform: translateX(-5px); }

        /* Card Utama */
        .game-card {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid var(--neon-blue);
            border-radius: 30px;
            padding: 40px;
            width: 90%; max-width: 600px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.2);
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }

        /* UI Elemen */
        input, select {
            width: 100%; padding: 15px; margin: 15px 0; border-radius: 15px;
            border: 1px solid var(--neon-blue); background: rgba(0,0,0,0.5); color: white;
            font-size: 16px; outline: none;
        }

        .btn-start {
            width: 100%; padding: 15px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            color: white; border: none; border-radius: 50px;
            font-weight: 800; font-family: 'Orbitron'; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
        }
        .btn-start:hover { transform: scale(1.02); box-shadow: 0 0 20px var(--neon-blue); }

        /* Game Area */
        #game-play { display: none; }
        .question-box {
            font-size: 24px; font-family: 'Orbitron'; margin: 30px 0;
            padding: 30px; background: rgba(255,255,255,0.05); border-radius: 20px;
            border-left: 5px solid var(--neon-purple);
        }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .opt-btn {
            padding: 15px; background: rgba(255,255,255,0.1); border: 1px solid #334155;
            border-radius: 12px; color: white; cursor: pointer; transition: 0.2s;
            font-weight: 600;
        }
        .opt-btn:hover { background: var(--neon-blue); color: black; border-color: white; }

        .progress-container {
            width: 100%; height: 10px; background: #1e293b; border-radius: 10px;
            margin-bottom: 20px; overflow: hidden;
        }
        #progress-fill { width: 0%; height: 100%; background: var(--neon-blue); transition: 0.3s; }
    </style>
</head>
<body>

    <div class="math-bg"></div>

    <nav class="nav-top">
        <a href="index.html" class="btn-home"><i class="fas fa-house"></i> BERANDA</a>
        <div style="font-family: 'Orbitron'; color: var(--neon-blue); font-size: 14px;">MATH LOGIC SYSTEM v1.0</div>
    </nav>

    <div class="game-card" id="auth-screen">
        <i class="fas fa-calculator" style="font-size: 60px; color: var(--neon-blue); margin-bottom: 20px;"></i>
        <h2 style="font-family: 'Orbitron'; margin-bottom: 10px;">MATH LOGIC</h2>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 25px;">Selesaikan 15 misi matematika sesuai level kelasmu!</p>
        
        <input type="text" id="p-name" placeholder="NAMA LENGKAP SISWA">
        <select id="p-class">
            <option value="7">KELAS 7 (BILANGAN & ALJABAR)</option>
            <option value="8">KELAS 8 (GEOMETRI & STATISTIKA)</option>
            <option value="9">KELAS 9 (FUNGSI & TRANSFORMASI)</option>
        </select>
        <button class="btn-start" onclick="initGame()">MASUK SISTEM</button>
    </div>

    <div class="game-card" id="game-play">
        <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 10px;">
            <span id="display-name" style="color: var(--neon-blue);"></span>
            <span id="display-score" style="color: #facc15;">SCORE: 0</span>
        </div>
        <div class="progress-container"><div id="progress-fill"></div></div>
        <p style="font-size: 12px; color: #94a3b8;">MISI KE- <span id="q-number">1</span> DARI 15</p>
        
        <div class="question-box" id="question-text">Memuat pertanyaan...</div>
        
        <div class="options-grid" id="options-container">
            </div>
    </div>

    <script>
        const mathData = {
            "7": [
                { q: "Hasil dari -12 + 7 adalah...", a: ["-5", "5", "-19", "19"], c: "-5" },
                { q: "Jika x + 5 = 12, maka nilai x adalah...", a: ["7", "17", "-7", "60"], c: "7" },
                { q: "Bentuk sederhana dari 3a + 2b - a adalah...", a: ["2a + 2b", "4a + 2b", "3a", "5ab"], c: "2a + 2b" },
                { q: "25% dari 200 adalah...", a: ["50", "25", "100", "75"], c: "50" },
                { q: "Hasil dari 2³ + 3² adalah...", a: ["17", "12", "15", "13"], c: "17" },
                { q: "KPK dari 12 dan 18 adalah...", a: ["36", "6", "72", "24"], c: "36" },
                { q: "Faktor dari 15 adalah...", a: ["1,3,5,15", "1,3,5", "3,5", "1,15"], c: "1,3,5,15" },
                { q: "Suhu 5°C di bawah nol ditulis...", a: ["-5°C", "5°C", "0°C", "10°C"], c: "-5°C" },
                { q: "Luas persegi dengan sisi 8cm...", a: ["64 cm²", "32 cm²", "16 cm²", "80 cm²"], c: "64 cm²" },
                { q: "Keliling lingkaran dengan d=14cm (π=22/7)...", a: ["44 cm", "88 cm", "154 cm", "22 cm"], c: "44 cm" },
                { q: "Hasil dari 1/2 + 1/4 adalah...", a: ["3/4", "2/4", "1/6", "2/6"], c: "3/4" },
                { q: "Himpunan bilangan prima antara 1-10...", a: ["2,3,5,7", "1,2,3,5", "3,5,7,9", "2,4,6,8"], c: "2,3,5,7" },
                { q: "Jika 3x = 15, maka x = ...", a: ["5", "3", "45", "12"], c: "5" },
                { q: "Perbandingan 20 menit ke 1 jam...", a: ["1:3", "1:2", "1:4", "2:3"], c: "1:3" },
                { q: "Hasil dari 10 - (-5) adalah...", a: ["15", "5", "-15", "-5"], c: "15" }
            ],
            "8": [
                { q: "Teorema Pythagoras: c² = ...", a: ["a² + b²", "a + b", "a² - b²", "2a + 2b"], c: "a² + b²" },
                { q: "Gradien garis y = 3x + 5 adalah...", a: ["3", "5", "-3", "1/3"], c: "3" },
                { q: "Sisi miring segitiga siku-siku (3cm, 4cm)...", a: ["5cm", "7cm", "12cm", "25cm"], c: "5cm" },
                { q: "Banyak titik sudut pada kubus adalah...", a: ["8", "6", "12", "4"], c: "8" },
                { q: "Median dari data: 5, 7, 8, 6, 9 adalah...", a: ["7", "6", "8", "5"], c: "7" },
                { q: "Rumus luas permukaan bola...", a: ["4πr²", "2πr", "πr²", "4/3 πr³"], c: "4πr²" },
                { q: "Penyelesaian dari 2x + y = 5 jika x=2...", a: ["y=1", "y=2", "y=3", "y=0"], c: "y=1" },
                { q: "Banyak diagonal ruang pada balok...", a: ["4", "8", "12", "6"], c: "4" },
                { q: "Sebuah dadu dilempar, peluang muncul mata 6...", a: ["1/6", "1/2", "5/6", "1/4"], c: "1/6" },
                { q: "Fungsi f(x)=2x+1, f(3) adalah...", a: ["7", "6", "5", "8"], c: "7" },
                { q: "Banyak rusuk pada prisma segitiga...", a: ["9", "6", "5", "12"], c: "9" },
                { q: "Volume tabung r=7, t=10...", a: ["1540 cm³", "770 cm³", "154 cm³", "440 cm³"], c: "1540 cm³" },
                { q: "Suku ke-5 dari barisan 2, 4, 6, 8...", a: ["10", "12", "14", "16"], c: "10" },
                { q: "Besar sudut siku-siku adalah...", a: ["90°", "180°", "45°", "360°"], c: "90°" },
                { q: "Rata-rata (mean) dari 10, 20, 30...", a: ["20", "10", "30", "15"], c: "20" }
            ],
            "9": [
                { q: "Akar dari x² - 9 = 0 adalah...", a: ["±3", "9", "3", "-3"], c: "±3" },
                { q: "Hasil dari 5⁰ adalah...", a: ["1", "0", "5", "50"], c: "1" },
                { q: "Transformasi pergeseran disebut juga...", a: ["Translasi", "Refleksi", "Rotasi", "Dilatasi"], c: "Translasi" },
                { q: "Nilai diskriminan (D) jika D > 0...", a: ["2 akar real", "Tidak ada akar", "1 akar kembar", "Akar imajiner"], c: "2 akar real" },
                { q: "Hasil dari √48 : √3 adalah...", a: ["4", "16", "√16", "2"], c: "4" },
                { q: "Refleksi titik (2,3) terhadap sumbu X...", a: ["(2,-3)", "(-2,3)", "(-2,-3)", "(3,2)"], c: "(2,-3)" },
                { q: "Bentuk baku dari 0,00056 adalah...", a: ["5,6 x 10⁻⁴", "56 x 10⁻⁵", "5,6 x 10⁴", "0,56 x 10⁻³"], c: "5,6 x 10⁻⁴" },
                { q: "Fungsi kuadrat memotong sumbu Y jika...", a: ["x = 0", "y = 0", "D = 0", "a = 0"], c: "x = 0" },
                { q: "Hasil dari (2²)³ adalah...", a: ["64", "32", "16", "12"], c: "64" },
                { q: "Volume kerucut r=7, t=6...", a: ["308 cm³", "154 cm³", "462 cm³", "616 cm³"], c: "308 cm³" },
                { q: "Dilatasi titik (1,2) dengan skala 3...", a: ["(3,6)", "(4,5)", "(1,6)", "(3,2)"], c: "(3,6)" },
                { q: "Sumbu simetri f(x)=x²-4x+3...", a: ["x=2", "x=-2", "x=4", "x=1"], c: "x=2" },
                { q: "Akar-akar dari x² - 5x + 6 = 0...", a: ["2 dan 3", "-2 dan -3", "1 dan 6", "5 dan 6"], c: "2 dan 3" },
                { q: "Syarat dua segitiga sebangun adalah...", a: ["Sudut bersesuaian sama", "Sisi harus sama panjang", "Warna sama", "Keliling sama"], c: "Sudut bersesuaian sama" },
                { q: "Nilai dari 2⁻³ adalah...", a: ["1/8", "-8", "1/6", "8"], c: "1/8" }
            ]
        };

        let pName, pClass, currentQ = 0, score = 0, quizPool = [];

        function initGame() {
            pName = document.getElementById('p-name').value;
            pClass = document.getElementById('p-class').value;
            if(!pName) return alert("Masukkan Nama Anda!");

            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('game-play').style.display = 'block';
            document.getElementById('display-name').innerText = `AGENT: ${pName.toUpperCase()}`;
            
            quizPool = [...mathData[pClass]].sort(() => Math.random() - 0.5);
            showQuestion();
        }

        function showQuestion() {
            if(currentQ < 15) {
                let data = quizPool[currentQ];
                document.getElementById('q-number').innerText = currentQ + 1;
                document.getElementById('question-text').innerText = data.q;
                document.getElementById('progress-fill').style.width = ((currentQ / 15) * 100) + "%";
                
                let optionsBtn = data.a.sort(() => Math.random() - 0.5).map(opt => 
                    `<button class="opt-btn" onclick="checkAnswer('${opt}')">${opt}</button>`
                ).join('');
                document.getElementById('options-container').innerHTML = optionsBtn;
            } else {
                finishGame();
            }
        }

        function checkAnswer(answer) {
            if(answer === quizPool[currentQ].c) {
                score += 10;
                document.getElementById('display-score').innerText = `SCORE: ${score}`;
            }
            currentQ++;
            showQuestion();
        }

        function finishGame() {
            alert(`SISTEM SELESAI!\nSkor Akhir ${pName}: ${score}`);
            saveToRanking(pName, score, pClass);
            location.reload();
        }

        function saveToRanking(name, score, grade) {
            let ranks = JSON.parse(localStorage.getItem('math_ranks')) || [];
            ranks.push({name: name, score: score, class: grade, date: new Date().toLocaleDateString()});
            ranks.sort((a,b) => b.score - a.score);
            localStorage.setItem('math_ranks', JSON.stringify(ranks.slice(0, 10)));
        }
    </script>
</body>
</html>
